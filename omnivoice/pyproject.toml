[project]
name = "omnivoice"
version = "0.1.0"
description = "OmniVoice - Core TTS/ASR models for VoiceStudio"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=4.45.0",
    "accelerate>=0.33.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "einops>=0.8.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]
training = [
    "lightning>=2.4.0",
    "wandb>=0.17.0",
    "tensorboard>=2.17.0",
    "optuna>=4.0.0",
]
all = [
    "omnivoice[dev,training]",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
