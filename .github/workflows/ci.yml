name: VoiceStudio backend and desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the independent VoiceStudio backend
        run: python -m pip install -e ./backend pytest pytest-asyncio httpx
      - run: python -m pip check
      - name: Backend parse and bootstrap regressions
        run: python -m pytest backend/tests -q --override-ini addopts=
      - name: Start the actual ASGI application with its lifespan
        working-directory: backend
        run: python tools/check_startup.py
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global bun@1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:electron
